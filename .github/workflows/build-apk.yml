name: Build SOWZ AE Studio Android

on:
  push:
    branches: [ "feature/android-effectcraft-wasm" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sowz-ae-android-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package native Android editor
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout SOWZ AE Studio
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run Android unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build native Android debug APK
        run: gradle assembleDebug --no-daemon

      - name: Verify native SOWZ editor APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q "classes.dex"
          if unzip -l "$APK" | grep -q "assets/effectcraft/"; then
            echo "The removed embedded EffectCraft website must not be packaged."
            exit 1
          fi
          echo "Native APK size:"
          wc -c "$APK"

      - name: Upload native SOWZ AE APK
        uses: actions/upload-artifact@v4
        with:
          name: SOWZ-AE-Studio-native-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14