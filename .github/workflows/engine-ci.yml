name: SOWZ AE shared engine CI

on:
  push:
    branches:
      - "feature/**"
    paths:
      - "engine/**"
      - ".github/workflows/engine-ci.yml"
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/engine-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-tests:
    name: Rust core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path engine/Cargo.toml -- --check
      - name: Run tests
        run: cargo test --manifest-path engine/Cargo.toml
      - name: Run Clippy
        run: cargo clippy --manifest-path engine/Cargo.toml --all-targets -- -D warnings
